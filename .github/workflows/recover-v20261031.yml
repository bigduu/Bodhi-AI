name: Recover Bodhi 2026.10.31 native builds
run-name: Recover Bodhi v2026.10.31 original 40714739339

on:
  workflow_dispatch:

concurrency:
  group: bodhi-release-2026.10.31
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Authenticate original pre-build failure
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify original reservation, source and pre-compile failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v20261031.cjs preflight

  build:
    name: Build recovered (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      SOURCE_ROOT: ${{ github.workspace }}/product
      BAMBOO_SIDECAR_SOURCE: release
      BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
      LOTUS_SOURCE: package
      LOTUS_PACKAGE_NAME: "@bigduu/lotus-next"
      APPLE_SIGNING_IDENTITY: "-"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Select existing recovered target
        id: original
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v20261031.cjs plan "${{ matrix.target }}"
      - uses: actions/checkout@v6
        if: steps.original.outputs.reuse != 'true'
        with:
          ref: ebd73744e75ea20ecd068a730213eeeb3f26e52b
          path: product
          persist-credentials: false
      - name: Verify frozen source and stamp version
        if: steps.original.outputs.reuse != 'true'
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recover-v20261031.cjs prepare "${{ matrix.target }}"
      - name: Install Linux packaging dependencies
        if: steps.original.outputs.reuse != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.original.outputs.reuse != 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        if: steps.original.outputs.reuse != 'true'
        with:
          workspaces: "product -> target"
          shared-key: bodhi-ci-${{ matrix.target }}
          cache-on-failure: true
      - uses: actions/cache@v5
        if: steps.original.outputs.reuse != 'true'
        with:
          path: product/src-tauri/.bamboo-sidecar-cache
          key: bodhi-bamboo-assets-v1-${{ matrix.target }}-${{ hashFiles('product/scripts/bamboo-sidecar-lock.json') }}
      - name: Install locked shell CLI
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: npm ci --prefer-offline --no-audit --ignore-scripts
      - name: Stage the exact prebuilt Lotus package
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" '@bigduu/lotus-next@2026.10.29' > "$RUNNER_TEMP/lotus-pack.json"
          python ../controller/scripts/stage-v20261031-lotus.py "$RUNNER_TEMP/bigduu-lotus-next-2026.10.29.tgz" node_modules/@bigduu/lotus-next
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const lotus = require('../controller/scripts/lotus-dist.cjs');
          const source = lotus.resolveSource(process.env, process.cwd());
          const identity = lotus.sourceIdentity(source);
          assert.equal(source.version, '2026.10.29');
          assert.equal(identity.sourceRevision, '9446b8d3a45f30345961fbe815bd39757a9cffd2');
          NODE
      - name: Verify source boundaries
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: |
          node scripts/verify-boundaries.cjs migration
          node scripts/verify-boundaries.cjs docs-boundary
      - name: Build recovered Tauri installers
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --verbose
      - name: Verify and capture recovered output
        if: steps.original.outputs.reuse != 'true'
        working-directory: controller
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_OUTPUT: ${{ runner.temp }}/bodhi-v31-recovered-output
        run: node scripts/recover-v20261031.cjs capture "${{ matrix.target }}"
      - name: Retain recovered target output
        if: steps.original.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.original.outputs.artifact_name }}
          path: ${{ runner.temp }}/bodhi-v31-recovered-output/
          if-no-files-found: error
          retention-days: 90
