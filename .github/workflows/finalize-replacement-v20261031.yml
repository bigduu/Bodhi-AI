name: Finalize Bodhi 2026.10.31 replacement
run-name: Finalize Bodhi v2026.10.31 replacement 40791597216

on:
  workflow_dispatch:

concurrency:
  group: bodhi-release-2026.10.31
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read
  checks: read

jobs:
  finalize:
    name: Finalize recovered Bodhi release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify replacement builds and upload assets
        working-directory: controller
        run: node scripts/finalize-replacement-v20261031.cjs assemble "${{ runner.temp }}/bodhi-v31-evidence.json"
      - name: Retain verified recovery publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: bodhi-v31-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bodhi-v31-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the original reserved release
        working-directory: controller
        run: node scripts/finalize-replacement-v20261031.cjs publish "${{ runner.temp }}/bodhi-v31-evidence.json"
