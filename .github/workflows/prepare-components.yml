name: Prepare published components
run-name: >-
  ${{ inputs.component == 'discover' && 'Discover published Bodhi component updates'
  || format('Component inputs for {0}', inputs.component == 'bamboo' && format('Bamboo {0}', inputs.bamboo || 'latest')
  || inputs.component == 'lotus' && format('Lotus {0}', inputs.lotus || 'latest')
  || format('Bamboo {0} and Lotus {1}', inputs.bamboo, inputs.lotus)) }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to verify
        type: choice
        default: pair
        options:
          - pair
          - bamboo
          - lotus
          - discover
      bamboo:
        description: Exact published Bamboo version (required for pair, defaults to latest for bamboo)
        type: string
      lotus:
        description: Exact published Lotus Next npm version (required for pair, defaults to latest for lotus)
        type: string
      previous_bamboo:
        description: Previously accepted Bamboo version for the change history
        type: string
      previous_lotus:
        description: Previously accepted Lotus Next version for the change history
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Verify original component identities
    if: inputs.component != 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the trusted repository entrypoint
        run: test "$GITHUB_REPOSITORY" = bigduu/Bodhi-AI && test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read and verify upstream outputs without building the shell
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT_SELECTION: ${{ inputs.component || 'pair' }}
          COMPONENT_BAMBOO: ${{ inputs.bamboo }}
          COMPONENT_LOTUS: ${{ inputs.lotus }}
          COMPONENT_PRIOR_BAMBOO: ${{ inputs.previous_bamboo }}
          COMPONENT_PRIOR_LOTUS: ${{ inputs.previous_lotus }}
        run: |
          set -euo pipefail
          case "$COMPONENT_SELECTION" in
            pair)
              if [[ -z "$COMPONENT_BAMBOO" || -z "$COMPONENT_LOTUS" ]]; then
                echo '::error::Pair mode requires exact published Bamboo and Lotus versions.'
                exit 1
              fi
              args=("$COMPONENT_BAMBOO" "$COMPONENT_LOTUS")
              if [[ -n "$COMPONENT_PRIOR_BAMBOO" || -n "$COMPONENT_PRIOR_LOTUS" ]]; then
                if [[ -z "$COMPONENT_PRIOR_BAMBOO" || -z "$COMPONENT_PRIOR_LOTUS" ]]; then
                  echo '::error::Pair change history requires both previous versions.'
                  exit 1
                fi
                args+=(--from "$COMPONENT_PRIOR_BAMBOO" "$COMPONENT_PRIOR_LOTUS")
              fi
              ;;
            bamboo)
              if [[ -n "$COMPONENT_LOTUS" || -n "$COMPONENT_PRIOR_LOTUS" ]]; then
                echo '::error::Leave both Lotus version fields blank for a Bamboo component.'
                exit 1
              fi
              args=(--component bamboo "${COMPONENT_BAMBOO:-latest}")
              if [[ -n "$COMPONENT_PRIOR_BAMBOO" ]]; then
                args+=(--from "$COMPONENT_PRIOR_BAMBOO")
              fi
              ;;
            lotus)
              if [[ -n "$COMPONENT_BAMBOO" || -n "$COMPONENT_PRIOR_BAMBOO" ]]; then
                echo '::error::Leave both Bamboo version fields blank for a Lotus component.'
                exit 1
              fi
              args=(--component lotus "${COMPONENT_LOTUS:-latest}")
              if [[ -n "$COMPONENT_PRIOR_LOTUS" ]]; then
                args+=(--from "$COMPONENT_PRIOR_LOTUS")
              fi
              ;;
            *)
              echo '::error::Select pair, bamboo or lotus.'
              exit 1
              ;;
          esac
          node scripts/prepare-component-candidate.cjs "${args[@]}" > "$RUNNER_TEMP/component-candidate.json"
      - uses: actions/upload-artifact@v7
        with:
          name: component-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-candidate.json
          if-no-files-found: error
          retention-days: 30

  discover:
    name: Discover published ${{ matrix.component }} updates
    if: inputs.component == 'discover'
    strategy:
      fail-fast: false
      matrix:
        component: [bamboo, lotus]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the trusted repository entrypoint
        run: test "$GITHUB_REPOSITORY" = bigduu/Bodhi-AI && test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the producer against the current client catalog
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/component-candidate.json"
          node scripts/prepare-component-candidate.cjs --since-catalog "$COMPONENT" > "$candidate"
          if [[ -s "$candidate" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            jq -r '"\(.component) \(.release.version) verified for compatibility review (catalog \(.catalog.version))."' "$candidate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$COMPONENT is current in the stable catalog." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.available == 'true'
        with:
          name: component-candidate-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-candidate.json
          if-no-files-found: error
          retention-days: 30
