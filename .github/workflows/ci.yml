name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: bodhi-feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LOTUS_SOURCE: package
  LOTUS_PACKAGE_NAME: "@bigduu/lotus-next"
  BAMBOO_SIDECAR_SOURCE: release
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"

jobs:
  unit-node:
    name: Unit Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require the exact feature merge source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Feature source: %H tree: %T' HEAD

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Verify migration and docs boundaries
        run: |
          node scripts/verify-boundaries.cjs migration
          node scripts/verify-boundaries.cjs docs-boundary

      - name: Run script unit tests
        run: npm run test:build

  native-tests:
    name: Unit and E2E (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      # Feature fixtures use an ad-hoc identity; no release credentials or
      # versioned installer are involved in these native tests.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require the exact feature merge source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git show -s --format='Feature source: %H tree: %T' HEAD

      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shell dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install the locked Lotus package
        shell: bash
        run: |
          set -euo pipefail
          LOTUS_VERSION="$(node -p "require('./scripts/frontend-package-lock.json').packageVersion")"
          npm install --no-save --ignore-scripts --package-lock=false "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache exact published Bamboo assets
        uses: actions/cache@v5
        with:
          path: src-tauri/.bamboo-sidecar-cache
          key: bodhi-bamboo-assets-v1-${{ matrix.target }}-${{ hashFiles('scripts/bamboo-sidecar-lock.json') }}

      - name: Rust test cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "bodhi-feature-tests-${{ matrix.target }}"
          cache-on-failure: true

      - name: Stage accepted inputs for debug assembly
        # Release sidecar mode downloads the existing Bamboo binary. The debug
        # hook stages its browser/frontend resources without rebuilding Bamboo.
        run: npm run build:sidecar:dev

      - name: Run native shell unit tests
        # Cargo compiles this target once in its test/debug profile. E2E uses
        # the exact resources copied by that invocation's build script.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Verify debug assembly inputs
        shell: bash
        run: npm run verify:assembly -- "${{ matrix.target }}" --assembly=debug

      - name: Run native actor and static frontend E2E
        shell: bash
        run: node scripts/sidecar-bundle-smoke.cjs "${{ matrix.target }}" --assembly=debug

      - name: Run native browser E2E
        shell: bash
        run: node scripts/browser-bundle-smoke.cjs "${{ matrix.target }}" "target/${{ matrix.target }}/debug/browser-runtime"

  unit-tests:
    name: Unit Tests
    needs: [unit-node, native-tests]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require every unit test result
        env:
          NODE_RESULT: ${{ needs.unit-node.result }}
          NATIVE_RESULT: ${{ needs.native-tests.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$NATIVE_RESULT" = success

  e2e-tests:
    name: E2E Tests
    needs: native-tests
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Require every native E2E result
        env:
          NATIVE_RESULT: ${{ needs.native-tests.result }}
        run: test "$NATIVE_RESULT" = success
