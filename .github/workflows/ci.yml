name: CI

on:
  pull_request:
    branches: [dev]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bodhi-feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LOTUS_SOURCE: package
  LOTUS_PACKAGE_NAME: "@bigduu/lotus-next"
  BAMBOO_SIDECAR_SOURCE: release
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"

jobs:
  unit-node:
    name: Unit Tests (Node)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require the exact feature merge source
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const env = process.env, event = JSON.parse(fs.readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = 'bigduu/Bodhi-AI', pr = event.pull_request;
          const positive = value => {
            assert.match(String(value), /^[1-9][0-9]*$/);
            const number = Number(value); assert.ok(Number.isSafeInteger(number)); return number;
          };
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(env.GITHUB_REPOSITORY, repository); assert.equal(env.GITHUB_EVENT_NAME, 'pull_request');
          assert.equal(event.repository.full_name, repository); assert.equal(pr.base.repo.full_name, repository);
          assert.equal(pr.head.repo.full_name, repository); assert.equal(pr.base.ref, 'dev'); assert.equal(event.number, pr.number);
          assert.equal(env.GITHUB_REF, `refs/pull/${positive(pr.number)}/merge`);
          const snapshot = git('rev-parse', 'HEAD'), tree = git('rev-parse', 'HEAD^{tree}');
          assert.equal(env.GITHUB_SHA, snapshot); assert.equal(git('status', '--porcelain', '--untracked-files=all'), '');
          // Raw commit headers retain parent IDs in checkout's depth-one clone.
          const raw = git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0];
          assert.deepEqual([...raw.matchAll(/^parent ([0-9a-f]{40})$/gm)].map(match => match[1]), [pr.base.sha, pr.head.sha]);
          const context = { schema: 'bodhi-feature-context/v1', repository, runId: positive(env.GITHUB_RUN_ID),
            physicalAttempt: positive(env.GITHUB_RUN_ATTEMPT), pullRequest: positive(pr.number),
            base: pr.base.sha, head: pr.head.sha, snapshot, tree };
          for (const key of ['base', 'head', 'snapshot', 'tree']) assert.match(context[key], /^[0-9a-f]{40}$/);
          console.log(`Feature source: ${snapshot} tree: ${tree}`);
          console.log(`Feature context: ${Buffer.from(JSON.stringify(context)).toString('base64')}`);
          NODE

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Verify migration and docs boundaries
        run: |
          node scripts/verify-boundaries.cjs migration
          node scripts/verify-boundaries.cjs docs-boundary

      - name: Run script unit tests
        run: npm run test:build

  native-tests:
    name: Unit and E2E (${{ matrix.target }})
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    env:
      BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      # Feature fixtures use an ad-hoc identity; no release credentials or
      # versioned installer are involved in these native tests.
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require the exact feature merge source
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const env = process.env, event = JSON.parse(fs.readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const repository = 'bigduu/Bodhi-AI', pr = event.pull_request;
          const positive = value => {
            assert.match(String(value), /^[1-9][0-9]*$/);
            const number = Number(value); assert.ok(Number.isSafeInteger(number)); return number;
          };
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(env.GITHUB_REPOSITORY, repository); assert.equal(env.GITHUB_EVENT_NAME, 'pull_request');
          assert.equal(event.repository.full_name, repository); assert.equal(pr.base.repo.full_name, repository);
          assert.equal(pr.head.repo.full_name, repository); assert.equal(pr.base.ref, 'dev'); assert.equal(event.number, pr.number);
          assert.equal(env.GITHUB_REF, `refs/pull/${positive(pr.number)}/merge`);
          const snapshot = git('rev-parse', 'HEAD'), tree = git('rev-parse', 'HEAD^{tree}');
          assert.equal(env.GITHUB_SHA, snapshot); assert.equal(git('status', '--porcelain', '--untracked-files=all'), '');
          // Raw commit headers retain parent IDs in checkout's depth-one clone.
          const raw = git('cat-file', '-p', 'HEAD').split('\n\n', 1)[0];
          assert.deepEqual([...raw.matchAll(/^parent ([0-9a-f]{40})$/gm)].map(match => match[1]), [pr.base.sha, pr.head.sha]);
          const context = { schema: 'bodhi-feature-context/v1', repository, runId: positive(env.GITHUB_RUN_ID),
            physicalAttempt: positive(env.GITHUB_RUN_ATTEMPT), pullRequest: positive(pr.number),
            base: pr.base.sha, head: pr.head.sha, snapshot, tree };
          for (const key of ['base', 'head', 'snapshot', 'tree']) assert.match(context[key], /^[0-9a-f]{40}$/);
          console.log(`Feature source: ${snapshot} tree: ${tree}`);
          console.log(`Feature context: ${Buffer.from(JSON.stringify(context)).toString('base64')}`);
          NODE

      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install shell dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install the locked Lotus package
        shell: bash
        run: |
          set -euo pipefail
          LOTUS_VERSION="$(node -p "require('./scripts/frontend-package-lock.json').packageVersion")"
          npm install --no-save --ignore-scripts --package-lock=false "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache exact published Bamboo assets
        uses: actions/cache@v5
        with:
          path: src-tauri/.bamboo-sidecar-cache
          key: bodhi-bamboo-assets-v1-${{ matrix.target }}-${{ hashFiles('scripts/bamboo-sidecar-lock.json') }}

      - name: Rust test cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "bodhi-feature-tests-${{ matrix.target }}"
          cache-on-failure: true

      - name: Stage accepted inputs for debug assembly
        # Release sidecar mode downloads the existing Bamboo binary. The debug
        # hook stages its browser/frontend resources without rebuilding Bamboo.
        run: npm run build:sidecar:dev

      - name: Run native shell unit tests
        # Cargo compiles this target once in its test/debug profile. E2E uses
        # the exact resources copied by that invocation's build script.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Verify debug assembly inputs
        shell: bash
        run: npm run verify:assembly -- "${{ matrix.target }}" --assembly=debug

      - name: Run native actor and static frontend E2E
        shell: bash
        run: node scripts/sidecar-bundle-smoke.cjs "${{ matrix.target }}" --assembly=debug

      - name: Run native browser E2E
        shell: bash
        run: node scripts/browser-bundle-smoke.cjs "${{ matrix.target }}" "target/${{ matrix.target }}/debug/browser-runtime"

  unit-tests:
    name: Unit Tests
    needs: [unit-node, native-tests]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Require every unit test result
        env:
          NODE_RESULT: ${{ needs.unit-node.result }}
          NATIVE_RESULT: ${{ needs.native-tests.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$NATIVE_RESULT" = success

  e2e-tests:
    name: E2E Tests
    needs: native-tests
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Require every native E2E result
        env:
          NATIVE_RESULT: ${{ needs.native-tests.result }}
        run: test "$NATIVE_RESULT" = success

  main-admission:
    name: Main Admission
    if: always() && github.event_name == 'pull_request_target' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify completed publication and exact main postimage
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the admitted main-base verifier executes. The initial trusted-D
        # bootstrap entrypoint is established separately by reviewed Ops.
        run: node scripts/main-admission.cjs
