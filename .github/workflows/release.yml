name: "publish"

on:
  workflow_dispatch:
    inputs:
      bodhi_version:
        description: "Bodhi app version to publish (default: keep current app version)"
        required: false
        default: "latest"
      bamboo_version:
        description: "bamboo-agent crate version to embed (default: latest)"
        required: false
        default: "latest"
      bamboo_ref:
        description: "Git ref of bigduu/Bamboo-agent to build the sidecar from (default: main)"
        required: false
        default: "main"
      lotus_version:
        description: "Lotus npm version to bundle (default: latest)"
        required: false
        default: "latest"

jobs:
  publish-tauri:
    env:
      BAMBOO_CRATE_NAME: "bamboo-agent"
      LOTUS_SOURCE: package
      LOTUS_PACKAGE_NAME: "@bigduu/lotus"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            artifact_name: "macos-x64"
            artifact_paths: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            artifact_name: "macos-arm64"
            artifact_paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu"
            artifact_name: "linux-x64"
            artifact_paths: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            artifact_name: "windows-x64"
            artifact_paths: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      # The bamboo sidecar is built from source (not the crates.io crate): the
      # published bamboo-agent crate does NOT ship frontend_package/, so a
      # `cargo install` would yield a backend with no embedded lotus UI. Building
      # the source tree lets scripts/build-sidecar.cjs embed lotus and produce a
      # self-contained `bamboo serve` binary. Without this the bundle ships the
      # build.rs placeholder (`exit 1`) and the app hangs on "Starting Bodhi…".
      - name: Checkout Bamboo source (sidecar backend)
        uses: actions/checkout@v6
        with:
          repository: bigduu/Bamboo-agent
          ref: ${{ github.event.inputs.bamboo_ref || 'main' }}
          path: bamboo-src

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify migration boundary
        run: node scripts/verify-boundaries.cjs migration

      - name: Verify docs boundary
        run: node scripts/verify-boundaries.cjs docs-boundary

      - name: Resolve Bodhi release version
        id: release_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bodhi_version }}" ] && [ "${{ github.event.inputs.bodhi_version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.bodhi_version }}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Bodhi release version: ${VERSION}"

      - name: Refuse to publish the placeholder version
        # Source ships 0.0.0 on purpose — you can tell at a glance it isn't a
        # real version. The release train passes the real date-based version via
        # bodhi_version; the 0.0.0 placeholder must never be published or tagged.
        if: steps.release_version.outputs.version == '0.0.0'
        run: |
          echo "::error::Bodhi version resolved to the 0.0.0 placeholder. Pass bodhi_version (the release train provides one from the Zenith config)."
          exit 1

      - name: Set Bodhi app version (workflow override)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bodhi_version != '' && github.event.inputs.bodhi_version != 'latest'
        shell: bash
        run: |
          TARGET_VERSION="${{ steps.release_version.outputs.version }}"
          export TARGET_VERSION
          node <<'NODE'
          const fs = require('node:fs');

          const target = process.env.TARGET_VERSION;
          const cargoPath = 'src-tauri/Cargo.toml';
          const tauriConfigPath = 'src-tauri/tauri.conf.json';

          const cargoBefore = fs.readFileSync(cargoPath, 'utf8');
          const cargoVersionPattern = /^version\s*=\s*"[^"]+"/m;
          if (!cargoVersionPattern.test(cargoBefore)) {
            throw new Error('Unable to find version entry in src-tauri/Cargo.toml');
          }
          const cargoAfter = cargoBefore.replace(/^version\s*=\s*"[^"]+"/m, `version = "${target}"`);
          if (cargoBefore !== cargoAfter) {
            fs.writeFileSync(cargoPath, cargoAfter);
          }

          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));
          tauriConfig.version = target;
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(tauriConfig, null, 2)}\n`);
          NODE

          echo "Using bodhi version override: ${TARGET_VERSION}"
          grep '^version = ' src-tauri/Cargo.toml | head -1
          node -p "require('./src-tauri/tauri.conf.json').version"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./bamboo-src -> target
          shared-key: "bodhi-release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Prepare crates.io build (strip patch, resolve bamboo-agent)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bamboo_version }}" ] && [ "${{ github.event.inputs.bamboo_version }}" != "latest" ]; then
            export BAMBOO_AGENT_VERSION="${{ github.event.inputs.bamboo_version }}"
            echo "Pinning ${BAMBOO_CRATE_NAME}@${BAMBOO_AGENT_VERSION}"
          else
            echo "Using latest compatible ${BAMBOO_CRATE_NAME} from crates.io"
          fi

          node scripts/prepare-crates-io-build.cjs

          # Refresh the lock for the rewritten requirement, then report what
          # bamboo-agent resolved to. The Bodhi shell no longer links
          # bamboo-agent (it's an e2e-backend-only dep), so read the resolved
          # version from the lockfile rather than bodhi's dependency tree.
          cargo update
          echo "Resolved ${BAMBOO_CRATE_NAME} in Cargo.lock:"
          grep -A1 "^name = \"${BAMBOO_CRATE_NAME}\"$" Cargo.lock | grep '^version' || echo "(not present)"

      - name: Install shell dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Install Lotus package
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.lotus_version }}" ]; then
            LOTUS_VERSION="${{ github.event.inputs.lotus_version }}"
          else
            LOTUS_VERSION="latest"
          fi
          echo "Using @bigduu/lotus@${LOTUS_VERSION}"
          npm install --no-save "@bigduu/lotus@${LOTUS_VERSION}"

      - name: Install Lotus into Bamboo source (sidecar frontend embed)
        # build-sidecar.cjs runs bamboo's frontend-package.cjs in LOTUS_SOURCE=package
        # mode, which resolves @bigduu/lotus from the bamboo checkout's node_modules
        # and embeds its prebuilt dist into the `bamboo` binary.
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.lotus_version }}" ]; then
            LOTUS_VERSION="${{ github.event.inputs.lotus_version }}"
          else
            LOTUS_VERSION="latest"
          fi
          echo "Installing @bigduu/lotus@${LOTUS_VERSION} into bamboo-src"
          npm install --no-save --prefix bamboo-src "@bigduu/lotus@${LOTUS_VERSION}"

      - name: Stage Lotus dist for bundling
        shell: bash
        run: |
          npm run web:build
          test -f .lotus-dist/index.html
          echo "Lotus dist staged in .lotus-dist"

      - name: Print Lotus source resolution
        run: npm run web:source:info

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the bamboo sidecar from the checked-out source for THIS matrix
          # target. build-sidecar.cjs (the configured beforeBuildCommand) reads
          # these: it embeds lotus (LOTUS_SOURCE=package, job env) and cross-builds
          # the binary to the app's triple so externalBin resolves to a real
          # backend instead of the build.rs `exit 1` placeholder.
          BAMBOO_SIDECAR_SOURCE: local
          BAMBOO_LOCAL_PATH: ${{ github.workspace }}/bamboo-src
          BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
          # Ad-hoc macOS signing: the runner keychain has no "Zenith Nova Code
          # Signing" cert (no Apple secrets configured), so the real identity in
          # tauri.conf can't be used and the build fails at codesign. "-" signs
          # ad-hoc so macOS bundles build. TODO: for distribution + persistent
          # TCC grants, add the cert as a secret, import it into the keychain
          # here, and drop this override so the real identity is used.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: app-v${{ steps.release_version.outputs.version }}
          releaseName: "App v${{ steps.release_version.outputs.version }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false # Release directly (was true for draft)
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts to Workflow
        uses: actions/upload-artifact@v7
        with:
          name: app-build-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: warn
