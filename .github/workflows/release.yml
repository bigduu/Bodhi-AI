name: publish
run-name: Bodhi v2 v${{ inputs.bodhi_version }} @ ${{ inputs.expected_source_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact accepted dev merge, frozen at release/<SHA>"
        required: true
        type: string
      bodhi_version:
        description: "Unused final YYYY.M.N version; reserved before any build"
        required: true
        type: string
      feature_pull_request:
        description: "Confirmed protected dev PR that accepted this exact cut"
        required: true
        type: string
      feature_run_id:
        description: "Successful feature Unit/E2E run for that PR"
        required: true
        type: string
      feature_run_attempt:
        description: "Exact successful feature run attempt"
        required: true
        type: string

permissions:
  contents: read
  actions: read

# The same allocator/lock and GitHub draft are used by publication and recovery.
concurrency:
  group: bodhi-release-${{ inputs.bodhi_version }}
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  RELEASE_VERSION: ${{ inputs.bodhi_version }}

jobs:
  preflight:
    name: Reserve admitted release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      frontend_package: ${{ steps.reserve.outputs.frontend_package }}
      frontend_version: ${{ steps.reserve.outputs.frontend_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_source_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Admit frozen dev source and reserve version
        id: reserve
        working-directory: controller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ROOT: ${{ github.workspace }}/product
          FEATURE_PULL_REQUEST: ${{ inputs.feature_pull_request }}
          FEATURE_RUN_ID: ${{ inputs.feature_run_id }}
          FEATURE_RUN_ATTEMPT: ${{ inputs.feature_run_attempt }}
        run: node scripts/release-finalizer-v2.cjs reserve "${{ runner.temp }}/reservation.json"
      - name: Retain original source admission and reservation
        if: steps.reserve.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bodhi-v2-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/reservation.json
          if-no-files-found: error
          retention-days: 90

  publish-tauri:
    name: Build original (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.platform }}
    # Native build steps never receive a publisher credential. The Tauri hook
    # alone stages the already-published Bamboo/Lotus/browser inputs.
    env:
      BAMBOO_SIDECAR_SOURCE: release
      BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
      LOTUS_SOURCE: package
      LOTUS_PACKAGE_NAME: ${{ needs.preflight.outputs.frontend_package }}
      APPLE_SIGNING_IDENTITY: "-"
      SOURCE_ROOT: ${{ github.workspace }}/product
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Select retained target output
        id: original
        working-directory: controller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-output.cjs plan "${{ matrix.target }}"
      - uses: actions/checkout@v6
        if: steps.original.outputs.reuse != 'true'
        with:
          ref: ${{ inputs.expected_source_sha }}
          path: product
          persist-credentials: false
      - name: Verify source and stamp reserved version
        if: steps.original.outputs.reuse != 'true'
        working-directory: controller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-output.cjs prepare "${{ matrix.target }}"
      - name: Install Linux packaging dependencies
        if: steps.original.outputs.reuse != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Install Rust stable
        if: steps.original.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache shell compilation
        if: steps.original.outputs.reuse != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "product -> target"
          shared-key: bodhi-ci-${{ matrix.target }}
          cache-on-failure: true
      - name: Cache exact published Bamboo inputs
        if: steps.original.outputs.reuse != 'true'
        uses: actions/cache@v5
        with:
          path: product/src-tauri/.bamboo-sidecar-cache
          key: bodhi-bamboo-assets-v1-${{ matrix.target }}-${{ hashFiles('product/scripts/bamboo-sidecar-lock.json') }}
      - name: Install shell dependencies
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: npm ci --prefer-offline --no-audit
      - name: Install accepted frontend package
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        shell: bash
        env:
          LOTUS_VERSION: ${{ needs.preflight.outputs.frontend_version }}
        run: npm install --no-save --ignore-scripts --package-lock=false "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
      - name: Verify source boundaries
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: |
          node scripts/verify-boundaries.cjs migration
          node scripts/verify-boundaries.cjs docs-boundary
      - name: Build original Tauri installers
        if: steps.original.outputs.reuse != 'true'
        working-directory: product
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --verbose
      - name: Verify static assembly and capture original outputs
        if: steps.original.outputs.reuse != 'true'
        working-directory: controller
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_OUTPUT: ${{ runner.temp }}/original-output
        run: node scripts/release-output.cjs capture "${{ matrix.target }}"
      - name: Retain original target output
        if: steps.original.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.original.outputs.artifact_name }}
          path: ${{ runner.temp }}/original-output/
          if-no-files-found: error
          retention-days: 90

  finalize:
    name: Publish original release
    needs: [preflight, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify original target receipts and upload assets
        working-directory: controller
        run: node scripts/release-finalizer-v2.cjs assemble "${{ runner.temp }}/evidence.json"
      - name: Retain original publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: bodhi-v2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the original draft
        working-directory: controller
        run: node scripts/release-finalizer-v2.cjs publish "${{ runner.temp }}/evidence.json"
