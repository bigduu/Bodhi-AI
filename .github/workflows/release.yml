name: "publish"

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact accepted Bodhi source commit selected by the release train"
        required: true
        type: string
      bodhi_version:
        description: "Bodhi app version to publish (default: keep current app version)"
        required: false
        default: "latest"
      bamboo_version:
        description: "bamboo-agent crate version to embed (default: latest)"
        required: false
        default: "latest"
      bamboo_ref:
        description: "Exact bigduu/Bamboo-agent ref used to build the managed sidecar"
        required: false
        default: "16e98d94cd971b7341dbd82110dd056497090d26"
      lotus_version:
        description: "Selected frontend npm version; Lotus Next must match the committed artifact lock"
        required: false
        default: "2026.10.8"
      frontend_package:
        description: "Frontend package; legacy Lotus is the explicit rollback path"
        required: true
        type: choice
        default: "@bigduu/lotus-next"
        options:
          - "@bigduu/lotus-next"
          - "@bigduu/lotus"

# A release version has one durable public tag. Serialize dispatches targeting
# that version, while each run writes only to its own draft tag below. Keeping
# cancel-in-progress false ensures an active release assembly is never cut off
# by a duplicate dispatch.
concurrency:
  group: bodhi-release-${{ github.event.inputs.bodhi_version || 'latest' }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    env:
      BAMBOO_CRATE_NAME: "bamboo-agent"
      LOTUS_SOURCE: package
      LOTUS_PACKAGE_NAME: ${{ github.event.inputs.frontend_package || '@bigduu/lotus-next' }}
      LEGACY_LOTUS_VERSION: "2026.8.28"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_PROGRESS: "false"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            artifact_name: "macos-x64"
            artifact_paths: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            artifact_name: "macos-arm64"
            artifact_paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu"
            artifact_name: "linux-x64"
            artifact_paths: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            artifact_name: "windows-x64"
            artifact_paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Require the exact accepted release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      # The managed sidecar is built from source rather than accepting the inert
      # shell-build placeholder. Lotus Next is supplied once as an owned Tauri
      # resource; only the explicit legacy rollback selection is embedded.
      - name: Checkout Bamboo source (sidecar backend)
        uses: actions/checkout@v6
        with:
          repository: bigduu/Bamboo-agent
          ref: ${{ github.event.inputs.bamboo_ref || '16e98d94cd971b7341dbd82110dd056497090d26' }}
          path: bamboo-src

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Verify migration boundary
        run: node scripts/verify-boundaries.cjs migration

      - name: Verify docs boundary
        run: node scripts/verify-boundaries.cjs docs-boundary

      - name: Resolve Bodhi release version
        id: release_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bodhi_version }}" ] && [ "${{ github.event.inputs.bodhi_version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.bodhi_version }}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Bodhi release version: ${VERSION}"

      - name: Refuse to publish the placeholder version
        # Source ships 0.0.0 on purpose — you can tell at a glance it isn't a
        # real version. The release train passes the real date-based version via
        # bodhi_version; the 0.0.0 placeholder must never be published or tagged.
        if: steps.release_version.outputs.version == '0.0.0'
        run: |
          echo "::error::Bodhi version resolved to the 0.0.0 placeholder. Pass bodhi_version (the release train provides one from the Zenith config)."
          exit 1

      - name: Set Bodhi app version (workflow override)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bodhi_version != '' && github.event.inputs.bodhi_version != 'latest'
        shell: bash
        run: |
          TARGET_VERSION="${{ steps.release_version.outputs.version }}"
          export TARGET_VERSION
          node <<'NODE'
          const fs = require('node:fs');

          const target = process.env.TARGET_VERSION;
          const cargoPath = 'src-tauri/Cargo.toml';
          const tauriConfigPath = 'src-tauri/tauri.conf.json';

          const cargoBefore = fs.readFileSync(cargoPath, 'utf8');
          const cargoVersionPattern = /^version\s*=\s*"[^"]+"/m;
          if (!cargoVersionPattern.test(cargoBefore)) {
            throw new Error('Unable to find version entry in src-tauri/Cargo.toml');
          }
          const cargoAfter = cargoBefore.replace(/^version\s*=\s*"[^"]+"/m, `version = "${target}"`);
          if (cargoBefore !== cargoAfter) {
            fs.writeFileSync(cargoPath, cargoAfter);
          }

          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));
          tauriConfig.version = target;
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(tauriConfig, null, 2)}\n`);
          NODE

          echo "Using bodhi version override: ${TARGET_VERSION}"
          grep '^version = ' src-tauri/Cargo.toml | head -1
          node -p "require('./src-tauri/tauri.conf.json').version"

      - name: Install Rust stable
        id: rust_build
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ./bamboo-src -> target
          # Reuse the target/compiler/manifest-keyed CI dependency cache.
          # Cargo still builds the selected exact sidecar and stamped shell.
          shared-key: "bodhi-ci-${{ matrix.target }}"
          cache-on-failure: true

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Prepare crates.io build (strip patch, resolve bamboo-agent)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.bamboo_version }}" ] && [ "${{ github.event.inputs.bamboo_version }}" != "latest" ]; then
            export BAMBOO_AGENT_VERSION="${{ github.event.inputs.bamboo_version }}"
            echo "Pinning ${BAMBOO_CRATE_NAME}@${BAMBOO_AGENT_VERSION}"
          else
            echo "Using latest compatible ${BAMBOO_CRATE_NAME} from crates.io"
          fi

          node scripts/prepare-crates-io-build.cjs

          # Refresh the lock for the rewritten requirement, then report what
          # bamboo-agent resolved to. The Bodhi shell no longer links
          # bamboo-agent (it's an e2e-backend-only dep), so read the resolved
          # version from the lockfile rather than bodhi's dependency tree.
          cargo update
          echo "Resolved ${BAMBOO_CRATE_NAME} in Cargo.lock:"
          grep -A1 "^name = \"${BAMBOO_CRATE_NAME}\"$" Cargo.lock | grep '^version' || echo "(not present)"

      - name: Install shell dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Install Lotus package
        shell: bash
        run: |
          if [ "${LOTUS_PACKAGE_NAME}" = "@bigduu/lotus" ]; then
            LOTUS_VERSION="${LEGACY_LOTUS_VERSION}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.lotus_version }}" ]; then
            LOTUS_VERSION="${{ github.event.inputs.lotus_version }}"
          else
            LOTUS_VERSION="2026.10.8"
          fi
          echo "Using ${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"
          npm install --no-save --ignore-scripts --package-lock=false "${LOTUS_PACKAGE_NAME}@${LOTUS_VERSION}"

      - name: Install explicit legacy rollback into Bamboo source
        if: env.LOTUS_PACKAGE_NAME == '@bigduu/lotus'
        # Only the rollback path asks Bamboo to embed the legacy package. Normal
        # Lotus Next release assembly carries one verified Tauri resource and
        # compiles the managed sidecar in API-only mode.
        shell: bash
        run: |
          echo "Installing explicit rollback @bigduu/lotus@${LEGACY_LOTUS_VERSION} into bamboo-src"
          npm install --no-save --ignore-scripts --package-lock=false --prefix bamboo-src "@bigduu/lotus@${LEGACY_LOTUS_VERSION}"

      - name: Stage Lotus dist for bundling
        shell: bash
        run: |
          npm run web:build
          node scripts/lotus-dist.cjs verify-staged

      - name: Print Lotus source resolution
        run: npm run web:source:info

      # Cache only compiler-validated target files for this exact source/target.
      # Cargo still runs before each bundle and all original smoke gates remain.
      - name: Restore exact Mac sidecar compilation
        if: runner.os == 'macOS'
        id: sidecar_cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            bamboo-src/target/release
            bamboo-src/target/${{ matrix.target }}/release
          key: bodhi-sidecar-v2-${{ matrix.target }}-${{ steps.rust_build.outputs.cachekey }}-${{ inputs.bamboo_ref || '16e98d94cd971b7341dbd82110dd056497090d26' }}-${{ env.LOTUS_PACKAGE_NAME }}-${{ hashFiles('bamboo-src/Cargo.lock', 'scripts/build-sidecar.cjs', 'scripts/frontend-package-lock.json') }}

      - name: Build Tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build the managed Bamboo sidecar from the selected exact source for
          # this matrix target. Lotus Next uses API-only plus the verified Tauri
          # resource; the explicit legacy selection alone uses the old embed.
          BAMBOO_SIDECAR_SOURCE: local
          BAMBOO_LOCAL_PATH: ${{ github.workspace }}/bamboo-src
          BAMBOO_SIDECAR_TARGET: ${{ matrix.target }}
          # Ad-hoc macOS signing: the runner keychain has no "Zenith Nova Code
          # Signing" cert (no Apple secrets configured), so the real identity in
          # tauri.conf can't be used and the build fails at codesign. "-" signs
          # ad-hoc so macOS bundles build. TODO: for distribution + persistent
          # TCC grants, add the cert as a secret, import it into the keychain
          # here, and drop this override so the real identity is used.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          # Draft tags are run-scoped, so no other dispatch can add or replace
          # assets in this run's unverified release.
          tagName: bodhi-draft-v${{ steps.release_version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          releaseName: "App v${{ steps.release_version.outputs.version }}"
          releaseBody: "See the assets to download this version and install."
          # Matrix jobs may upload only to a draft. The final job publishes it
          # after every target and post-build assembly gate has succeeded.
          releaseDraft: true
          releaseCommitish: ${{ github.sha }}
          prerelease: false
          args: ${{ matrix.args }} --verbose

      - name: Save exact Mac sidecar compilation
        if: always() && runner.os == 'macOS' && steps.sidecar_cache.outputs.cache-primary-key != '' && steps.sidecar_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            bamboo-src/target/release
            bamboo-src/target/${{ matrix.target }}/release
          key: ${{ steps.sidecar_cache.outputs.cache-primary-key }}

      - name: Diagnose failed Mac DMG assembly
        if: failure() && runner.os == 'macOS' && steps.tauri_build.conclusion == 'failure'
        continue-on-error: true
        shell: bash
        env:
          BODHI_DIAGNOSTIC_TARGET: ${{ matrix.target }}
          BODHI_DIAGNOSTIC_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" .
          /usr/bin/hdiutil info
          node <<'NODE' > "$RUNNER_TEMP/dmg-failure-source.json"
          const { execFileSync } = require('node:child_process');
          const git = args => execFileSync('git', args, {encoding:'utf8'}).trim();
          console.log(JSON.stringify({sourceSha:process.env.BODHI_DIAGNOSTIC_SOURCE,checkoutSha:git(['rev-parse','HEAD']),bambooSha:git(['-C','bamboo-src','rev-parse','HEAD']),target:process.env.BODHI_DIAGNOSTIC_TARGET,acceptance:false},null,2));
          NODE
          bundle="target/$BODHI_DIAGNOSTIC_TARGET/release/bundle"
          if [ -d "$bundle/macos" ] && [ -d "$bundle/dmg" ]; then
            # tar preserves the original executable modes, symlinks and signature.
            tar -czf "$RUNNER_TEMP/dmg-failure-bundle.tar.gz" -C "$bundle" macos dmg
          fi

      - name: Retain failed Mac DMG assembly diagnostics
        if: failure() && runner.os == 'macOS' && steps.tauri_build.conclusion == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dmg-failure-${{ matrix.artifact_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dmg-failure-source.json
            ${{ runner.temp }}/dmg-failure-bundle.tar.gz
            target/${{ matrix.target }}/release/bundle/dmg/bundle_dmg.sh
          if-no-files-found: warn
          retention-days: 7

      - name: Verify exact frontend and real target sidecar
        shell: bash
        run: npm run verify:assembly -- "${{ matrix.target }}"

      - name: Smoke native bundled sidecar actor transport
        shell: bash
        run: node scripts/sidecar-bundle-smoke.cjs "${{ matrix.target }}"

      - name: Smoke bundled browser host
        shell: bash
        env:
          BODHI_BROWSER_TARGET: ${{ matrix.target }}
        run: |
          runtime="src-tauri/browser-runtime"
          if [[ "$BODHI_BROWSER_TARGET" == *apple-darwin ]]; then
            runtime="target/$BODHI_BROWSER_TARGET/release/bundle/macos/Bodhi AI.app/Contents/Resources/browser-runtime"
          fi
          node scripts/browser-bundle-smoke.cjs "$BODHI_BROWSER_TARGET" "$runtime"

      - name: Upload Build Artifacts to Workflow
        uses: actions/upload-artifact@v7
        with:
          name: app-build-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  finalize-release:
    name: Publish fully verified release
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Require the exact accepted release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve verified release version
        id: release_version
        shell: bash
        env:
          REQUESTED_BODHI_VERSION: ${{ github.event.inputs.bodhi_version }}
        run: |
          if [ -n "${REQUESTED_BODHI_VERSION}" ] && [ "${REQUESTED_BODHI_VERSION}" != "latest" ]; then
            VERSION="${REQUESTED_BODHI_VERSION}"
          else
            VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if [ "${VERSION}" = "0.0.0" ]; then
            echo "::error::Refusing to publish the placeholder Bodhi version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish the completed draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_TAG: bodhi-draft-v${{ steps.release_version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TAG: app-v${{ steps.release_version.outputs.version }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict"
          import { execFileSync, spawnSync } from "node:child_process"
          const repository = process.env.GITHUB_REPOSITORY
          assert.equal(repository, "bigduu/Bodhi-AI")
          const version = process.env.RELEASE_VERSION
          assert.match(version, /^[1-9][0-9]{3}\.(?:[1-9]|1[0-2])\.[1-9][0-9]*$/)
          const api = (path, method = "GET", body) => {
            const args = ["api", `repos/${repository}/${path}`, "--method", method]
            if (body) args.push("--input", "-")
            const result = spawnSync("gh", args, {encoding:"utf8", maxBuffer:16*1024*1024, input:body && JSON.stringify(body)})
            if (result.error) throw result.error
            if (result.status !== 0) {
              if (method === "GET" && /HTTP 404/.test(result.stderr)) return null
              throw new Error(`GitHub ${method} ${path} failed: ${result.stderr}`)
            }
            return JSON.parse(result.stdout)
          }
          // GitHub's by-tag endpoint only returns published releases. Drafts are
          // uniquely selected from the paginated list, then read and edited by ID.
          const releases = JSON.parse(execFileSync("gh", ["api", "--paginate", "--slurp", `repos/${repository}/releases?per_page=100`], {encoding:"utf8", maxBuffer:16*1024*1024})).flat()
          const matches = releases.filter((r) => r.tag_name === process.env.DRAFT_TAG)
          assert.equal(matches.length, 1, "Expected one isolated original run/attempt draft")
          assert.equal(releases.filter((r) => r.tag_name === process.env.RELEASE_TAG).length, 0, "Refusing to replace any existing final release")
          const release = api(`releases/${matches[0].id}`)
          assert.equal(release.id, matches[0].id)
          assert.equal(release.draft, true)
          assert.equal(release.prerelease, false)
          assert.equal(release.tag_name, process.env.DRAFT_TAG)
          assert.equal(release.target_commitish, process.env.GITHUB_SHA, "Draft must identify the accepted Bodhi source")
          const expectedNames = [`Bodhi.AI-${version}-1.x86_64.rpm`, `Bodhi.AI_${version}_aarch64.dmg`, `Bodhi.AI_${version}_amd64.AppImage`, `Bodhi.AI_${version}_amd64.deb`, `Bodhi.AI_${version}_x64-setup.exe`, `Bodhi.AI_${version}_x64.dmg`, "Bodhi.AI_aarch64.app.tar.gz", "Bodhi.AI_x64.app.tar.gz"]
          assert.deepEqual(release.assets.map((a) => a.name).sort(), expectedNames.sort())
          assert.equal(new Set(release.assets.map((a) => a.id)).size, 8)
          const prefixes = new Set()
          for (const asset of release.assets) {
            assert.equal(asset.state, "uploaded")
            assert.ok(Number.isSafeInteger(asset.size) && asset.size >= 1024*1024)
            assert.match(asset.digest, /^sha256:[0-9a-f]{64}$/)
            assert.equal(asset.url, `https://api.github.com/repos/${repository}/releases/assets/${asset.id}`)
            const url = new URL(asset.browser_download_url)
            assert.equal(url.origin, "https://github.com")
            assert.equal(url.search + url.hash, "")
            const prefix = `/bigduu/Bodhi-AI/releases/download/`
            assert.ok(url.pathname.startsWith(prefix) && url.pathname.endsWith(`/${asset.name}`))
            const draftPath = url.pathname.slice(prefix.length, -(asset.name.length+1))
            assert.ok(draftPath === process.env.DRAFT_TAG || /^untagged-[0-9a-f]+$/.test(draftPath))
            prefixes.add(draftPath)
          }
          assert.equal(prefixes.size, 1)
          const identity = (r) => r.assets.map(({id,name,size,digest,state}) => ({id,name,size,digest,state})).sort((a,b) => a.name.localeCompare(b.name))
          const original = identity(release)
          const fresh = api(`releases/${release.id}`)
          assert.equal(fresh.draft, true)
          assert.equal(fresh.tag_name, release.tag_name)
          assert.equal(fresh.target_commitish, release.target_commitish)
          assert.deepEqual(identity(fresh), original)
          assert.equal(api(`git/ref/tags/${process.env.RELEASE_TAG}`), null, "Refusing to move an existing final tag")
          const published = api(`releases/${release.id}`, "PATCH", {tag_name:process.env.RELEASE_TAG, target_commitish:process.env.GITHUB_SHA, name:`App v${version}`, draft:false, prerelease:false, make_latest:"true"})
          assert.equal(published.id, release.id)
          assert.equal(published.draft, false)
          assert.equal(published.tag_name, process.env.RELEASE_TAG)
          assert.equal(published.target_commitish, process.env.GITHUB_SHA)
          assert.deepEqual(identity(published), original, "Preserve every original asset ID, size and digest")
          for (const asset of published.assets) assert.equal(asset.browser_download_url, `https://github.com/${repository}/releases/download/${process.env.RELEASE_TAG}/${asset.name}`)
          console.log(`Published verified original release ${published.id}: ${published.html_url}`)
          NODE
