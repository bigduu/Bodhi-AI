[package]
name = "bodhi"
version = "0.0.0"
description = "A Tauri App"
authors = ["bigduu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bodhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
# Tauri core and plugins
# `devtools` is only enabled for development/debug builds via the `dev` feature
# (wired to debug builds in build.rs). Release builds ship without devtools.
tauri = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

async-stream = { workspace = true }

# Error Handling & Utilities
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging and Debug
log = { workspace = true }
env_logger = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
zstd = { workspace = true }

crossbeam = { workspace = true }

# Utilities
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-notification = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
portable-pty = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3"

once_cell = { workspace = true }

[target.'cfg(windows)'.dependencies]
# CLI install (cli_install.rs): user-PATH edit must be REG_EXPAND_SZ-safe, so
# it goes through the registry API instead of `[Environment]::Set…` (which
# silently downgrades the value type), plus WM_SETTINGCHANGE broadcast.
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
# Enable the Tauri Web Inspector (devtools). Intended for development/debug
# builds only; keep it out of `default` so release builds ship without it.
dev = ["tauri/devtools"]
# Internal company features - only enable in company environment
internal = []

[dev-dependencies]
tempfile = { workspace = true }
