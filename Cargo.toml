[workspace]
# e2e-backend is `exclude`d from the build workspace: it links the full local
# `bamboo-agent` (via the [patch.crates-io] override), whose dep tree (toml 1.1,
# russh pre-releases) conflicts with tauri-build's toml 0.9 in a SHARED lockfile
# — serde_spanned can't unify. The Bodhi shell (src-tauri) links ZERO bamboo, so
# excluding the e2e harness lets the app build resolve cleanly. Re-add to
# `members` only when running the e2e suite (separate lock resolution).
members = ["src-tauri"]
exclude = ["e2e-backend"]
resolver = "2"
default-members = ["src-tauri"]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
] }
actix-web = "4"
actix-cors = "0.7"
actix-http = "3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dirs = "5"
dashmap = "6"
futures = "0.3"
futures-util = "0.3"
bytes = "1"
walkdir = "2"
libc = "0.2"
async-stream = "0.3"

# Data structures
glob = "0.3"
globset = "0.4"

# Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# Database
rusqlite = "0.31"

# Tauri
tauri = { version = "2.5", features = ["macos-private-api"] }
tauri-build = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"

# Bamboo engine — used only by e2e-backend now (the Bodhi shell runs bamboo as a
# sidecar binary, not a linked crate).
#
# PLACEHOLDER: 0.0.0 is never a real published version, so it can't ship as-is —
# that's the point (you can tell at a glance it must be replaced). Local dev
# resolves it through the [patch.crates-io] override below (../bamboo also ships
# the 0.0.0 placeholder). Every crates.io build — plain CI and release — runs
# scripts/prepare-crates-io-build.cjs, which strips the patch and rewrites this
# one line to a resolvable requirement: the pinned release version, or "*"
# (latest published) in plain CI.
bamboo-agent = "0.0.0"

# Development
tempfile = "3"
wiremock = "0.5"
tokio-test = "0.4"
mockall = "0.13"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Other
url = "2"
once_cell = "1"
crossbeam = "0.8"
zstd = "0.13"
webbrowser = "1"
portable-pty = "0.8"
toml = "0.8"

[patch.crates-io]
# Local development override: use the bamboo workspace checkout instead of crates.io.
# CI/release workflows remove this section to pull from crates.io.
bamboo-agent = { path = "../bamboo" }
