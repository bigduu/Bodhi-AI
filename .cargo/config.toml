# Dev-profile tuning to slow down target/ disk growth.
# Release profile is untouched — shipped Tauri bundles build from release.

[profile.dev]
# Line tables keep file:line in backtraces at a fraction of full debuginfo size.
debug = "line-tables-only"

# Third-party dependencies get no debug info at all ("*" excludes workspace
# members, so bodhi's own crates keep their line tables).
[profile.dev.package."*"]
debug = false
