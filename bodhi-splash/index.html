<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bodhi</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1e1e; color: #9aa0a6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center; }
      .wrap { text-align: center; }
      .spinner { width: 30px; height: 30px; margin: 0 auto 14px;
        border: 3px solid #3a3a3a; border-top-color: #8ab4f8; border-radius: 50%;
        animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hint { font-size: 12px; opacity: 0.6; margin-top: 6px; }
    </style>
  </head>
  <body>
    <!-- Shown only while the bamboo sidecar boots. The Rust shell navigates this
         webview to the sidecar's URL once it is healthy (see sidecar.rs). -->
    <div class="wrap">
      <div class="spinner"></div>
      Starting Bodhi…
      <div class="hint">launching local engine</div>
    </div>
  </body>
</html>
