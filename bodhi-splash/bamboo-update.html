<!doctype html>
<html lang="{{locale}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        color: #dadce0; background: #1e1e1e; font-family: system-ui, sans-serif;
      }
      main { padding: 24px; text-align: center; }
      h1 { margin: 0; font-size: 1.125rem; }
      p { color: #bdc1c6; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{heading}}</h1>
      <p>{{hint}}</p>
    </main>
  </body>
</html>
